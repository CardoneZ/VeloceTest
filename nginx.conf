# ============================================================================
# Nginx Reverse Proxy Configuration for VeloceExpress
# Place in: /etc/nginx/sites-available/veloce-express
# Symlink: ln -s /etc/nginx/sites-available/veloce-express /etc/nginx/sites-enabled/
# ============================================================================

server {
    listen 80;
    server_name tu-dominio.com www.tu-dominio.com; # Reemplaza con tu dominio o IP

    # Logging
    access_log /var/log/nginx/veloce_access.log;
    error_log /var/log/nginx/veloce_error.log;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical for Real-Time Server-Sent Events (SSE)
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
